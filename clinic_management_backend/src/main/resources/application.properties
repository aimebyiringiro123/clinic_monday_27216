spring.application.name=Clinick Managent System
server.port=8400

spring.datasource.url=jdbc:postgresql://localhost:5432/clinic_management_db
spring.datasource.username=postgres
spring.datasource.password=4560
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
